# Infrastructure only — SQL Server, Redis, RabbitMQ
# Lệnh: docker compose -f infrastructure/docker/docker-compose.infra.yml up -d
# Chạy từ thư mục gốc project

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ip-sqlserver
    environment:
      SA_PASSWORD: "Dev@Password123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    volumes: [sqlserver-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dev@Password123!' -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ip-redis
    ports: ["6380:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ip-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
